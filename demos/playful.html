<!doctype html>
<html lang="zh">

    <button class="ctl" data-density aria-pressed="false">+1 列表行 → 引擎自动重排</button>
  </div>
  <div class="stage" data-theme="playful" data-scale="1"></div>
  <div class="readout"></div>
  <script src="assets/content.js"></script>
